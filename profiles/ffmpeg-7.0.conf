PKG_VERSION_NINJA="v1.13.2"
PKG_VERSION_MESON="1.11.1"

# ── Crypto ──
# openssl path (--nonfree) and gnutls path are mutually exclusive
PKG_VERSION_OPENSSL="3.3.0"
PKG_VERSION_GMP="6.3.0"
PKG_VERSION_NETTLE="3.9.1"
PKG_VERSION_GNUTLS="3.8.4"

# libressl and mbedtls: the two --tls arms no profile pinned, so a --profile
# build silently fell back to whatever the recipe defaulted to. Both are
# deliberately the same current version in EVERY profile, unlike openssl/gnutls
# which carry era-appropriate pins: holding an old TLS library to match an old
# FFmpeg means shipping known upstream security fixes (e.g. the LibreSSL 4.2.0
# CMS out-of-bounds read/write) back out of a build, which is not a trade a
# version profile should make on the user's behalf.
PKG_VERSION_LIBRESSL="4.3.2"
PKG_VERSION_MBEDTLS="3.6.4"

