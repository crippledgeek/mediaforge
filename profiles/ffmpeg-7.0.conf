# FFmpeg 7.0 Build Profile
# Dependency versions contemporary with FFmpeg 7.0 release (~Apr 2024)
# Researched from GitHub release history — 2026-03-16

# ── FFmpeg ──
FFMPEG_VERSION="7.0"

# ── Build Tools ──
PKG_VERSION_GIFLIB="5.2.2"
PKG_VERSION_PKG_CONFIG="0.29.2"
PKG_VERSION_YASM="1.3.0"
PKG_VERSION_NASM="2.16.01"
PKG_VERSION_ZLIB="1.3.1"
